[build]
  publish = "."
  functions = "api"
  node_bundler = "esbuild"

[dev]
  framework = "#static"
  targetPort = 3000

# ── Function-specific settings ──
[functions]
  node_bundler = "esbuild"
  included_files = ["api/**"]

# ── Redirects: all non-asset paths serve index.html (SPA-style) ──
[[redirects]]
  from = "/booking"
  to   = "/booking.html"
  status = 200

[[redirects]]
  from = "/family"
  to   = "/family.html"
  status = 200

[[redirects]]
  from = "/admin"
  to   = "/admin.html"
  status = 200

[[redirects]]
  from = "/confirmation"
  to   = "/confirmation.html"
  status = 200

# ── Security headers ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options       = "ALLOWALL"
    # ALLOWALL so Squarespace can embed via iframe
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    # Admin page: never embeddable

[[headers]]
  for = "/family.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    # Family page: private, no indexing

